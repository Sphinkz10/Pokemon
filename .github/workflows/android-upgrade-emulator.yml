name: Android real APK upgrade and process restart

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'engine/**'
      - 'tests/v3_android_upgrade/**'
      - '.github/workflows/android-upgrade-emulator.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'engine/**'
      - 'tests/v3_android_upgrade/**'
      - '.github/workflows/android-upgrade-emulator.yml'

permissions:
  contents: read

jobs:
  signed-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout complete git history to build pinned previous version
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Audit real upgrade safety before running emulator
        run: python3 tests/v3_android_upgrade/verify_upgrade.py --check-source
      - name: Enable hardware accelerated emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build old/new APKs and test the real on-device upgrade
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash tests/v3_android_upgrade/run_upgrade.sh
      - name: Verify all three staged on-device upgrade outcomes
        run: python3 tests/v3_android_upgrade/verify_upgrade.py --verify-results
      - name: Archive actual signed-version / installation / test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-pr25-same-signature-upgrade-proof
          path: |
            app/build/reports/pr25-apk-upgrade/**
          if-no-files-found: warn
          retention-days: 21
