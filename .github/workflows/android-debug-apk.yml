name: Build PokemonPvP APK (debug)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'PokemonPvP-v1.51-CI-APK-ready.zip'
      - '.github/workflows/android-debug-apk.yml'

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Confirm source ZIP was uploaded
        run: |
          if [ ! -s PokemonPvP-v1.51-CI-APK-ready.zip ]; then
            echo "::error::Falta o arquivo PokemonPvP-v1.51-CI-APK-ready.zip na raiz do repositório. Carrega o ZIP com Add file > Upload files."
            exit 1
          fi

      - name: Unpack and validate archive
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          p=Path('PokemonPvP-v1.51-CI-APK-ready.zip')
          with ZipFile(p) as z:
              bad=[n for n in z.namelist() if n.startswith('/') or '..' in Path(n).parts or '\\' in n]
              if bad: raise ValueError(f'Untrusted ZIP paths: {bad[:5]}')
              z.extractall('android-source')
          for name in ['settings.gradle.kts','app/build.gradle.kts','engine/build.gradle.kts','app/src/main/java/com/rui/pvpgo/MainActivity.kt']:
              assert Path('android-source',name).is_file(), f'Missing source: {name}'
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android APK from full source ZIP
        working-directory: android-source
        run: gradle --no-daemon --stacktrace :engine:compileKotlin :app:assembleDebug

      - name: Confirm APK exists
        run: |
          test -s android-source/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android-source/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PokemonPvP-v1.51-debug-apk
          path: android-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
