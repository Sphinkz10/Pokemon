name: Build PokemonPvP APK (debug)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'engine/**'
      - 'gradle/**'
      - 'gradlew'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'tests/**'
      - '.github/workflows/android-debug-apk.yml'

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout Android source
        uses: actions/checkout@v4
      - name: Validate project structure
        run: |
          test -s settings.gradle.kts
          test -s build.gradle.kts
          test -s app/build.gradle.kts
          test -s engine/build.gradle.kts
          test -s gradle/wrapper/gradle-wrapper.jar
          test -s app/src/main/java/com/rui/pvpgo/MainActivity.kt
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate V1.52 dashboard data integrity
        run: python3 tests/v1_52_dashboard_truth/verify_dashboard.py
      - name: Validate V1.53 skins and community calendar
        run: python3 tests/v1_53_skins_events/verify_architecture.py
      - name: Validate V1.54 real events and skin integration
        run: python3 tests/v1_54_feed_theme/verify_v154.py --live
      - name: Validate National Dex scaling and image cache
        run: python3 tests/v1_51_national_scale/verify_scale_wiring.py
      - name: Validate National Dex detail and navigation
        run: python3 tests/v1_55_national_navigation/verify_navigation.py
      - name: Validate V1.56 four-league Pokémon 360 and safe builds
        run: python3 tests/v1_56_league_360/verify_wiring.py
      - name: Validate V1.57 collection flow and edit integrity
        run: python3 tests/v1_57_collection_flow/verify_flow.py
      - name: Validate V1.58 lifecycle-safe Collection navigation
        run: python3 tests/v1_58_navigation_lifecycle/verify_navigation.py
      - name: Validate Team Advisor locked-slot regression wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          advisor = Path("app/src/main/java/com/rui/pvpgo/CollectionTeamAdvisor.kt").read_text()
          fixture = Path("tools/TeamAdvisorV122Validation.kt").read_text()
          assert "constraints.lockedOwnedPokemonIds.size > 3" in advisor
          assert "TeamAdvisorStatus.REFUSED" in fixture and "tooManyLocks" in fixture
          print("TEAM_LOCKED_SLOT_GUARD_OK (structural only)")
          PY
      - name: Build debug APK directly from repository
        run: gradle --no-daemon --stacktrace :engine:compileKotlin :app:assembleDebug
      - name: Run Android policy unit tests
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest
      - name: Confirm unit test report
        run: |
          test -s app/build/test-results/testDebugUnitTest/TEST-com.rui.pvpgo.NationalDexPolicyTest.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          test_classes = {
              "NationalDexPolicyTest": 7,
              "SpeciesLeaguePolicyTest": 5,
              "OwnedBuildValidationTest": 7,
              "CollectionNavigationPolicyTest": 7,
          }
          for name, minimum_tests in test_classes.items():
              path = f"app/build/test-results/testDebugUnitTest/TEST-com.rui.pvpgo.{name}.xml"
              doc = ET.parse(path).getroot()
              tests = int(doc.get("tests", 0))
              failures = int(doc.get("failures", 0)) + int(doc.get("errors", 0))
              skipped = int(doc.get("skipped", 0))
              print(f"{name}: {tests} tests, {failures} failures, {skipped} skipped")
              assert tests >= minimum_tests and failures == 0 and skipped == 0, f"{name} unit tests failed"
          PY
      - name: Confirm generated APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Verify signature and install compatibility
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs --min-sdk-version 26 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E '^(package:|sdkVersion:|targetSdkVersion:|application-label:)'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "name='com.rui.pvpgo.installtestv158'"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PokemonPvP-v1.58-installtest-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
