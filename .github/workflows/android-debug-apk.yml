name: Build PokemonPvP APK (debug)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'engine/**'
      - 'gradle/**'
      - 'gradlew'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'tests/**'
      - '.github/workflows/android-debug-apk.yml'

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout Android source
        uses: actions/checkout@v4
      - name: Validate project structure
        run: |
          test -s settings.gradle.kts
          test -s build.gradle.kts
          test -s app/build.gradle.kts
          test -s engine/build.gradle.kts
          test -s gradle/wrapper/gradle-wrapper.jar
          test -s app/src/main/java/com/rui/pvpgo/MainActivity.kt
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate V1.52 dashboard data integrity
        run: python3 tests/v1_52_dashboard_truth/verify_dashboard.py
      - name: Validate V1.53 skins and community calendar
        run: python3 tests/v1_53_skins_events/verify_architecture.py
      - name: Build debug APK directly from repository
        run: gradle --no-daemon --stacktrace :engine:compileKotlin :app:assembleDebug
      - name: Confirm generated APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Verify signature and install compatibility
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs --min-sdk-version 26 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E '^(package:|sdkVersion:|targetSdkVersion:|application-label:)'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "name='com.rui.pvpgo.installtest'"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PokemonPvP-v1.53-installtest-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
