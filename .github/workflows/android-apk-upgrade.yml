name: Android APK 58 to 59 in-place upgrade

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'engine/**'
      - 'tests/v3_apk_upgrade/**'
      - '.github/workflows/android-apk-upgrade.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'engine/**'
      - 'tests/v3_apk_upgrade/**'
      - '.github/workflows/android-apk-upgrade.yml'

permissions:
  contents: read

jobs:
  upgrade-in-place:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Audit upgrade gate and data-loss exclusions
        run: python3 tests/v3_apk_upgrade/verify_contract.py --source
      - name: Build baseline and candidate with same keystore
        run: bash tests/v3_apk_upgrade/verify_upgrade.sh prepare
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Actual adb install -r and data survival on Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash tests/v3_apk_upgrade/verify_upgrade.sh execute
      - name: Require device evidence for seed, force-stop and upgrade
        run: python3 tests/v3_apk_upgrade/verify_contract.py --evidence
      - name: Preserve signed upgrade proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-pr25-real-apk-upgrade-proof
          path: ${{ runner.temp }}/pokemon-pr25-upgrade/upgrade-proof.txt
          retention-days: 21
          if-no-files-found: warn
