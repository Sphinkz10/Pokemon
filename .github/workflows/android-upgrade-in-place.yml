name: Android signed in-place APK upgrade (data retention)

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/build.gradle.kts'
      - 'app/src/upgradeTest/**'
      - '.github/scripts/verify-android-upgrade.sh'
      - '.github/workflows/android-upgrade-in-place.yml'
      - 'tests/v3_android_upgrade/**'

permissions:
  contents: read

jobs:
  upgrade-data-retention:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout previous accepted main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: previous
      - name: Checkout candidate PR source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: current
      - name: Validate actual upgrade contract
        run: python3 current/tests/v3_android_upgrade/verify_upgrade_workflow.py
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android 35
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Set up same Gradle home and DEBUG signing keystore for both APK builds
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build previous signed APK, Android version code from base
        working-directory: previous
        run: gradle --no-daemon :app:assembleDebug
      - name: Build candidate signed APK and isolated upgrade test APK
        working-directory: current
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest -PupgradeSuite=true
      - name: Enable KVM for real Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test actual adb install -r, process death and saved data
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash current/.github/scripts/verify-android-upgrade.sh
      - name: Publish upgrade evidence even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-signed-upgrade-preserved-user-data
          path: current/app/build/upgrade-reports/**
          if-no-files-found: warn
          retention-days: 21
